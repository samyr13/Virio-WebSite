<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Virio — bannière du README</title>
    <link rel="stylesheet" href="../kit.css" />
    <style>
      html, body { background: transparent; }
      .card { position: absolute; inset: 0; border-radius: 36px; overflow: hidden; background: var(--ink); }
      .stage { --glow-at: 74% 50%; --glow-size: 55% 85%; }
      .logo { left: 96px; top: 84px; height: 58px; }
      h1 { left: 92px; top: 196px; font-size: 150px; width: 760px; }
      .lead { left: 96px; top: 500px; width: 640px; font-size: 30px; }
      .c3 { left: 960px; top: -50px; transform: rotate(6deg); }
      .c1 { left: 900px; top: 150px; transform: rotate(-5deg); }
      .c2 { left: 1040px; top: 380px; transform: rotate(4deg); }
      .shield { left: 1380px; top: 430px; width: 150px; filter: drop-shadow(0 26px 44px rgba(0, 0, 0, 0.7)); }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="stage"></div>
      <div class="abs notif dim c3" data-sms="1" style="--u: 1.55px"></div>
      <div class="abs notif hit c1" data-sms="0" data-chip="Faux domaine" style="--u: 1.7px"></div>
      <div class="abs notif hit c2" data-sms="2" data-chip="Demande vos codes" style="--u: 1.5px"></div>
      <img class="abs shield" src="../../../logo/virio-symbole-plein.svg" alt="" />
      <img class="abs logo" src="../../../logo/virio-logo-horizontal.svg" alt="Virio" />
      <h1 class="abs slam">Un clic suffit.</h1>
      <p class="abs lead">L'extension Chrome gratuite qui bloque les arnaques au moment du clic.</p>
    </div>
    <script src="../kit.js"></script>
  </body>
</html>
