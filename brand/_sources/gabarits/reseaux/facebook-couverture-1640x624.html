<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Virio — couverture Facebook</title>
    <link rel="stylesheet" href="../kit.css" />
    <style>
      /* Facebook recadre les côtés sur mobile : tout le message tient au centre */
      .stage { --glow-at: 50% 50%; --glow-size: 45% 80%; }
      .logo { left: 50%; top: 120px; height: 64px; transform: translateX(-50%); }
      h1 { left: 0; right: 0; top: 230px; text-align: center; font-size: 132px; }
      .lead { left: 0; right: 0; top: 400px; text-align: center; font-size: 28px; }
      .c1 { left: -20px; top: 90px; transform: rotate(-7deg); }
      .c2 { left: 120px; top: 330px; transform: rotate(5deg); }
      .c3 { left: 1300px; top: 60px; transform: rotate(6deg); }
      .c4 { left: 1250px; top: 330px; transform: rotate(-5deg); }
    </style>
  </head>
  <body>
    <div class="stage"></div>
    <div class="abs notif hit c1" data-sms="0" data-chip="Faux domaine" style="--u: 1.1px"></div>
    <div class="abs notif hit c2" data-sms="5" data-chip="Imite l'État" style="--u: 1.05px"></div>
    <div class="abs notif hit c3" data-sms="1" data-chip="Créé il y a 3 jours" style="--u: 1.05px"></div>
    <div class="abs notif hit c4" data-sms="2" data-chip="Demande vos codes" style="--u: 1.1px"></div>
    <img class="abs logo" src="../../../logo/virio-logo-horizontal.svg" alt="Virio" />
    <h1 class="abs slam">Un clic suffit.</h1>
    <p class="abs lead">L'extension Chrome gratuite qui bloque les arnaques.</p>
    <script src="../kit.js"></script>
  </body>
</html>
