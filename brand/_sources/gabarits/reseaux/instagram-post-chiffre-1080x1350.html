<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Virio — post Instagram chiffre</title>
    <link rel="stylesheet" href="../kit.css" />
    <style>
      .stage { --glow-at: 40% 38%; --glow-size: 80% 55%; }
      .kicker-line { left: 80px; top: 120px; font-size: 34px; font-weight: 600; color: var(--text-2); }
      .fig { left: 70px; top: 220px; font-size: 300px; font-weight: 800; letter-spacing: -0.045em; line-height: 0.9; white-space: nowrap; }
      .fig small { font-size: 0.42em; letter-spacing: -0.02em; color: var(--threat); margin-left: 0.06em; }
      .text { left: 80px; top: 540px; width: 880px; font-size: 52px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.08; }
      .src { left: 80px; top: 820px; font-size: 22px; color: var(--muted); }
      .rule { left: 80px; right: 80px; top: 1060px; height: 1px; background: var(--line); }
      .logo { left: 80px; top: 1130px; height: 50px; }
      .cta { right: 80px; top: 1124px; font-size: 24px; }
    </style>
  </head>
  <body>
    <div class="stage"></div>
    <p class="abs kicker-line">En France, en 2023</p>
    <p class="abs fig">4,5<small>Md€</small></p>
    <p class="abs text">de préjudice pour les escroqueries enregistrées. Deux fois plus qu'en 2016.</p>
    <p class="abs src">Source : SSMSI, ministère de l'Intérieur, 2024</p>
    <div class="abs rule"></div>
    <img class="abs logo" src="../../../logo/virio-logo-horizontal.svg" alt="Virio" />
    <span class="abs pill pill-safe cta">Gratuit · Bientôt disponible</span>
  </body>
</html>
