<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Virio — post Instagram « le bon réflexe »</title>
    <link rel="stylesheet" href="../kit.css" />
    <style>
      .stage { --glow-at: 50% 46%; --glow-size: 80% 50%; }
      h1 { left: 80px; top: 110px; font-size: 104px; width: 900px; }
      .card { left: 80px; top: 390px; width: 920px; }
      .card .notif-body { font-size: 40px; }
      .tip { left: 80px; top: 870px; width: 900px; display: grid; grid-template-columns: 56px 1fr; gap: 22px; font-size: 38px; line-height: 1.3; color: var(--text-2); }
      .tip svg { width: 52px; height: 52px; color: var(--safe); margin-top: 4px; }
      .tip b { color: var(--text); }
      .rule { left: 80px; right: 80px; top: 1100px; height: 1px; background: var(--line); }
      .logo { left: 80px; top: 1160px; height: 50px; }
      .cta { right: 80px; top: 1154px; font-size: 24px; }
    </style>
  </head>
  <body>
    <div class="stage"></div>
    <h1 class="abs slam">Ce SMS est <span class="threat">faux.</span></h1>
    <div class="abs notif hit card" style="--u: 2.4px; width: 920px">
      <div class="notif-head"><i data-ic="msg"></i>Messages<time>maintenant</time></div>
      <div class="notif-from">AMENDES-INFO</div>
      <div class="notif-body">Amende impayée : 35 €. Majoration à 375 € <span class="flag">sous 24 h</span><span class="tag">Urgence</span>. Payez ici :</div>
      <span class="notif-link">antai-paiement-gouv.com</span><span class="tag" style="font-size: 30px">Faux domaine</span>
    </div>
    <div class="abs tip"><i data-ic="check"></i><p><b>Le bon réflexe :</b> une amende se vérifie sur antai.gouv.fr, en tapant l'adresse vous-même.</p></div>
    <div class="abs rule"></div>
    <img class="abs logo" src="../../../logo/virio-logo-horizontal.svg" alt="Virio" />
    <span class="abs pill pill-safe cta">Gratuit · Bientôt disponible</span>
    <script src="../kit.js"></script>
  </body>
</html>
