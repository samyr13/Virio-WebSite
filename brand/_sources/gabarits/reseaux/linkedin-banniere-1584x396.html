<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Virio — bannière LinkedIn</title>
    <link rel="stylesheet" href="../kit.css" />
    <style>
      /* LinkedIn pose la photo de profil en bas à gauche */
      .stage { --glow-at: 60% 50%; --glow-size: 50% 100%; }
      h1 { left: 520px; top: 92px; font-size: 92px; }
      .lead { left: 524px; top: 280px; width: 560px; font-size: 22px; }
      .c1 { left: 1150px; top: 40px; transform: rotate(-6deg); }
      .c2 { left: 1270px; top: 210px; transform: rotate(5deg); }
      .c3 { left: 40px; top: -70px; transform: rotate(6deg); }
      .c4 { left: 210px; top: 110px; transform: rotate(-5deg); }
      .shield { left: 1460px; top: 70px; width: 92px; filter: drop-shadow(0 20px 34px rgba(0, 0, 0, 0.7)); }
    </style>
  </head>
  <body>
    <div class="stage"></div>
    <div class="abs notif dim c3" data-sms="4" style="--u: 1px"></div>
    <div class="abs notif dim c4" data-sms="6" style="--u: 1px"></div>
    <div class="abs notif hit c1" data-sms="0" data-chip="Faux domaine" style="--u: 1px"></div>
    <div class="abs notif hit c2" data-sms="2" data-chip="Demande vos codes" style="--u: 0.95px"></div>
    <img class="abs shield" src="../../../logo/virio-symbole-plein.svg" alt="" />
    <h1 class="abs slam">Un clic suffit.</h1>
    <p class="abs lead">L'extension Chrome gratuite qui bloque les arnaques au moment du clic.</p>
    <script src="../kit.js"></script>
  </body>
</html>
