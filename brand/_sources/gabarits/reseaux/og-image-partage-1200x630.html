<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Virio — image de partage</title>
    <link rel="stylesheet" href="../kit.css" />
    <style>
      .stage { --glow-at: 78% 50%; }
      .logo { left: 64px; top: 56px; height: 46px; }
      h1 { left: 64px; top: 168px; font-size: 118px; width: 600px; }
      .lead { left: 66px; top: 418px; width: 520px; font-size: 27px; }
      .meta { left: 66px; bottom: 54px; display: flex; gap: 12px; font-size: 17px; }
      .c1 { left: 668px; top: 120px; transform: rotate(-5deg); }
      .c2 { left: 790px; top: 372px; transform: rotate(4deg); }
      .c3 { left: 720px; top: -40px; transform: rotate(6deg); }
      .shield { left: 1010px; top: 404px; width: 132px; filter: drop-shadow(0 24px 40px rgba(0, 0, 0, 0.7)); }
    </style>
  </head>
  <body>
    <div class="stage"></div>
    <div class="abs notif dim c3" data-sms="1" style="--u: 1.25px"></div>
    <div class="abs notif hit c1" data-sms="0" data-chip="Faux domaine" style="--u: 1.4px"></div>
    <div class="abs notif hit c2" data-sms="2" data-chip="Demande vos codes" style="--u: 1.25px"></div>
    <img class="abs shield" src="../../../logo/virio-symbole-plein.svg" alt="" />
    <img class="abs logo" src="../../../logo/virio-logo-horizontal.svg" alt="Virio" />
    <h1 class="abs slam">Un clic suffit.</h1>
    <p class="abs lead">L'extension Chrome gratuite qui bloque les arnaques au moment du clic.</p>
    <div class="abs meta"><span class="pill pill-safe">100 % gratuit</span><span class="pill pill-line">Extension Chrome</span></div>
    <script src="../kit.js"></script>
  </body>
</html>
